<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>probe</title></head>
<body style="margin:0;background:#fff;overflow:hidden">
<div id="diag" style="height:40px;font:18px/40px monospace;background:#111;color:#0f0;padding:0 10px;white-space:nowrap;overflow:hidden">booting…</div>
<iframe id="f" style="width:1470px;height:2300px;border:0;display:block" src="about:blank"></iframe>
<script>
const q = new URLSearchParams(location.search);
const email = q.get("email") || "sara@myappo.local";
const pass = q.get("pass") || "Miaadi@2026";
const route = q.get("route") || "profile";
const waitMs = Number(q.get("wait") || "4500");
const F = document.getElementById("f");
const D = document.getElementById("diag");
const errs = [];
function say(s) { D.textContent = s; document.title = s; }
window.addEventListener("error", (e) => errs.push(String(e.message)));

async function boot() {
  try {
    const r = await fetch("https://zneqnijqjwkpcjetgwfe.supabase.co/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: "sb_publishable_S_1qT5uowoxmngDc_CSSFQ_7v0OlvYl" },
      body: JSON.stringify({ email, password: pass }),
    });
    const session = await r.json();
    if (!session.access_token) { say("AUTH FAIL " + JSON.stringify(session).slice(0, 240)); return; }
    localStorage.setItem("sb-zneqnijqjwkpcjetgwfe-auth-token", JSON.stringify(session));
    F.src = "/#" + route;
    setTimeout(() => {
      try {
        const d = F.contentDocument;
        const T = (sel) => { const e = d.querySelector(sel); return e ? e.textContent.replace(/\s+/g, " ").trim() : "-"; };
        const hero = [T("#pf-name-ar"), T("#pf-role"), T("#pf-email-short"), T("#pf-phone-short"), T("#pf-since"), T("#pf-stat-upcoming"), T("#pf-stat-completed")].join(" | ");
        const tabs = Array.from(d.querySelectorAll("[data-pf-tab]")).map((b) => b.textContent.trim() + (b.className.includes("bg-primary") ? "(active)" : "")).join(", ");
        const apsRows = Array.from(d.querySelectorAll("#pf-aps-list > div")).slice(0, 4).map((r) => r.textContent.replace(/\s+/g, " ").trim());
        const nameVal = (d.querySelector("#pf-name") || {}).value || "";
        const phoneVal = (d.querySelector("#pf-phone") || {}).value || "";
        const sess = T("#pf-sessions");
        const toggles = Array.from(d.querySelectorAll("[data-pf-toggle]")).map((i) => i.getAttribute("data-pf-toggle") + "=" + i.checked).join(",");
        const guestHidden = d.querySelector("#pf-guest") ? d.querySelector("#pf-guest").className.includes("hidden") : "?";
        say([
          "HERO:" + hero,
          "NAME:" + nameVal + " PHONE:" + phoneVal,
          "TABS:" + tabs,
          "APS:" + apsRows.join(" ;; "),
          "SESS:" + sess,
          "TOG:" + toggles,
          "GUESTHIDDEN:" + guestHidden,
          "errs:" + (errs.length ? errs.join("|").slice(0, 300) : "none")
        ].join(" ### "));
      } catch (e) { say("diag:" + e.message); }
    }, waitMs);
  } catch (e) { say("boot:" + e.message); }
}
boot();
</script>
</body>
</html>
