<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="theme-color" content="#00685F" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>ميعادي — حجز المواعيد الطبية</title>
  <link rel="preload" href="/fonts/material-symbols-1.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <script>
    try {
      var t = localStorage.getItem("miaadi.theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">
  <div id="app"></div>
  <div id="toast-container" class="fixed bottom-[max(2rem,env(safe-area-inset-bottom))] left-1/2 -translate-x-1/2 z-[60] flex flex-col items-center gap-2 pointer-events-none px-4 w-full max-w-lg"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
