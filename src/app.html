<!doctype html>
<html lang="ar" dir="rtl" class="h-full">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00685F" />

  <link rel="preconnect" href="https://zneqnijqjwkpcjetgwfe.supabase.co" crossorigin />

  <link rel="stylesheet" href="/fonts/fonts.css?v=3" />
  <script>
    try {
      var t = localStorage.getItem("miaadi.theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  %sveltekit.head%
</head>

<body class="bg-surface font-body-md text-on-surface antialiased" data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
